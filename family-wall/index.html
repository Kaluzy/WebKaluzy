<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>Family Wall</title>
  <style>
    :root{
      --bg:#0f172a;--panel:#111827;--soft:#1f2937;--text:#f8fafc;--muted:#cbd5e1;
      --abi:#f9a8d4;--raphi:#93c5fd;--gold:#fcd34d;--green:#86efac;--red:#fca5a5;
      font-family:Inter,ui-rounded,"SF Pro Rounded",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text)}
    body{min-height:100vh;overflow-x:hidden;background:
      radial-gradient(circle at 5% 0%,rgba(59,130,246,.22),transparent 30%),
      radial-gradient(circle at 95% 5%,rgba(236,72,153,.18),transparent 28%),
      linear-gradient(145deg,#0f172a,#111827 60%,#172033)}
    .shell{max-width:1180px;margin:0 auto;padding:22px}
    .hero{display:grid;grid-template-columns:1.4fr .6fr;gap:18px;align-items:stretch;margin-bottom:18px}
    .hero-main,.clock-card,.kid,.wide-card{background:rgba(17,24,39,.82);border:1px solid rgba(255,255,255,.08);box-shadow:0 18px 50px rgba(0,0,0,.25);backdrop-filter:blur(16px)}
    .hero-main{border-radius:28px;padding:24px 26px;position:relative;overflow:hidden}
    .hero-main:after{content:"";position:absolute;right:-30px;bottom:-45px;width:190px;height:190px;border-radius:50%;background:linear-gradient(135deg,rgba(252,211,77,.35),rgba(249,168,212,.25));filter:blur(4px)}
    .eyebrow{font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:800}
    h1{font-size:48px;line-height:1;margin:8px 0 8px;letter-spacing:-.04em}
    .subtitle{font-size:21px;color:var(--muted);font-weight:600}
    .clock-card{border-radius:28px;padding:22px;display:flex;flex-direction:column;justify-content:center;text-align:center}
    .clock{font-size:48px;font-weight:900;letter-spacing:-.04em}.date{font-size:18px;color:var(--muted);font-weight:700;margin-top:4px}.updated{font-size:12px;color:#94a3b8;margin-top:10px}
    .kids{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:18px}
    .kid{border-radius:28px;padding:22px;min-height:290px;position:relative;overflow:hidden}
    .kid.abi{border-top:5px solid var(--abi)}.kid.raphi{border-top:5px solid var(--raphi)}
    .kid-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.kid-name{font-size:34px;font-weight:900}.badge{padding:7px 11px;border-radius:999px;font-size:13px;font-weight:900;background:rgba(255,255,255,.08);color:var(--muted)}
    .task{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid rgba(255,255,255,.07);font-size:22px;line-height:1.25;font-weight:700}.task:first-child{border-top:0}.dot{width:10px;height:10px;border-radius:50%;margin-top:9px;flex:0 0 auto}.abi .dot{background:var(--abi)}.raphi .dot{background:var(--raphi)}
    .row{display:grid;grid-template-columns:1.25fr .75fr;gap:18px;margin-bottom:18px}
    .wide-card{border-radius:28px;padding:22px}.section-title{font-size:16px;text-transform:uppercase;letter-spacing:.12em;color:#94a3b8;font-weight:900;margin-bottom:12px}
    .event{display:grid;grid-template-columns:54px 1fr;gap:12px;align-items:center;padding:11px 0;border-top:1px solid rgba(255,255,255,.07)}.event:first-of-type{border-top:0}.event-icon{font-size:30px}.event-text{font-size:20px;font-weight:760;line-height:1.25}
    .parent-action{background:linear-gradient(145deg,rgba(252,211,77,.18),rgba(252,211,77,.08));border:1px solid rgba(252,211,77,.28)}
    .parent-action .big{font-size:26px;font-weight:900;line-height:1.25;color:#fff7cc}
    .status-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.status-pill{background:rgba(255,255,255,.055);border-radius:18px;padding:15px}.status-pill .label{font-size:12px;color:#94a3b8;text-transform:uppercase;letter-spacing:.08em;font-weight:900}.status-pill .value{font-size:16px;font-weight:800;margin-top:6px;line-height:1.25}
    .footer{text-align:center;color:#64748b;font-size:12px;padding:2px 0 4px}
    .ok{color:var(--green)}
    @media(max-width:780px){
      .shell{padding:12px}.hero{grid-template-columns:1fr}.clock-card{display:none}.kids,.row{grid-template-columns:1fr}.status-grid{grid-template-columns:1fr}.hero-main,.kid,.wide-card{border-radius:22px;padding:18px}h1{font-size:38px}.subtitle{font-size:18px}.kid-name{font-size:30px}.task{font-size:19px}.kid{min-height:auto}.event-text{font-size:18px}
    }
    @media(min-width:781px) and (max-height:650px){.shell{padding:12px}.hero{margin-bottom:10px}.hero-main,.clock-card,.kid,.wide-card{padding:16px;border-radius:20px}.kids,.row{gap:10px;margin-bottom:10px}h1{font-size:36px}.clock{font-size:38px}.kid{min-height:auto}.kid-name{font-size:28px}.task{font-size:18px;padding:8px 0}.event{padding:7px 0}.event-text{font-size:17px}}
  </style>
</head>
<body>
<div class="shell">
  <header class="hero">
    <div class="hero-main">
      <div class="eyebrow">School Command Center</div>
      <h1>👋 Good evening, family</h1>
      <div class="subtitle">Know what matters. Do it. Then enjoy your time.</div>
    </div>
    <div class="clock-card"><div id="clock" class="clock"></div><div id="date" class="date"></div><div id="updated" class="updated"></div></div>
  </header>

  <main>
    <section class="kids">
      <article class="kid abi"><div class="kid-head"><div class="kid-name">👧 Abi</div><div class="badge">2nd Grade</div></div><div id="abi"></div></article>
      <article class="kid raphi"><div class="kid-head"><div class="kid-name">👦 Raphi</div><div class="badge">4th Grade</div></div><div id="raphi"></div></article>
    </section>

    <section class="row">
      <article class="wide-card"><div class="section-title">📅 Coming up</div><div id="family"></div></article>
      <article class="wide-card parent-action"><div class="section-title">👨 Parent action</div><div id="parent" class="big"></div></article>
    </section>

    <section class="wide-card"><div class="section-title">✅ School status</div><div id="status" class="status-grid"></div></section>
  </main>
  <div class="footer">Family-safe summary • refreshes automatically every 3 minutes</div>
</div>
<script>
const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));
function taskList(id,items){const el=document.getElementById(id);const arr=(items&&items.length?items:['✅ Nothing new']);el.innerHTML=arr.map(x=>'<div class="task"><span class="dot"></span><span>'+esc(x.replace(/^[^\w\d]+\s*/,''))+'</span></div>').join('')}
function eventList(items){const el=document.getElementById('family');const arr=(items&&items.length?items:['✅ Nothing new']);el.innerHTML=arr.map(x=>{const m=x.match(/^(\S+)\s+(.*)$/);return '<div class="event"><div class="event-icon">'+esc(m?m[1]:'📌')+'</div><div class="event-text">'+esc(m?m[2]:x)+'</div></div>'}).join('')}
function statusList(items){const labels=['Transportation','Lunch / MySchoolBucks','Forms / Supplies'];const arr=(items&&items.length?items:['No new problem','No new issue','No action']);document.getElementById('status').innerHTML=arr.slice(0,3).map((x,i)=>'<div class="status-pill"><div class="label">'+esc(labels[i]||'Status')+'</div><div class="value"><span class="ok">●</span> '+esc(x.replace(/^\S+\s*/,'').replace(/^[^:]+:\s*/,''))+'</div></div>').join('')}
function tick(){const n=new Date();document.getElementById('clock').textContent=n.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});if(!document.getElementById('date').textContent)document.getElementById('date').textContent=n.toLocaleDateString([],{weekday:'long',month:'long',day:'numeric'});}setInterval(tick,1000);tick();
async function load(){try{const r=await fetch('data.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error();const d=await r.json();document.getElementById('date').textContent=d.date||'';document.getElementById('updated').textContent='Updated '+(d.updated||'just now');taskList('abi',d.abi);taskList('raphi',d.raphi);eventList(d.family);document.getElementById('parent').textContent=d.parentAction||'Nothing urgent tonight.';statusList(d.status);}catch(e){document.getElementById('updated').textContent='Waiting for update…'}}
load();setInterval(load,180000);
</script>
</body>
</html>
