<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>Family Wall</title>
  <style>
    :root{
      --bg:#07111f;--panel:#101b2d;--panel2:#13233a;--text:#f8fafc;--muted:#b8c5d8;
      --abi:#ff9ed2;--raphi:#80c7ff;--gold:#ffd86b;--green:#7ee2a8;--cyan:#79e7ff;--violet:#b9a3ff;
      font-family:Inter,ui-rounded,"SF Pro Rounded",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    }
    *{box-sizing:border-box} html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text)}
    body{min-height:100vh;overflow-x:hidden;background:
      radial-gradient(circle at 0% 0%,rgba(54,125,255,.26),transparent 28%),
      radial-gradient(circle at 100% 8%,rgba(255,88,175,.2),transparent 26%),
      linear-gradient(145deg,#07111f,#0d1728 58%,#13233a)}
    .shell{max-width:1220px;margin:0 auto;padding:18px}
    .hero{display:grid;grid-template-columns:1.4fr .6fr;gap:14px;margin-bottom:14px}.glass{background:rgba(16,27,45,.84);border:1px solid rgba(255,255,255,.09);box-shadow:0 16px 44px rgba(0,0,0,.28);backdrop-filter:blur(14px)}
    .hero-main{border-radius:26px;padding:20px 24px;position:relative;overflow:hidden}.hero-main:after{content:"";position:absolute;right:-38px;bottom:-60px;width:220px;height:220px;border-radius:50%;background:linear-gradient(135deg,rgba(255,216,107,.3),rgba(185,163,255,.26));filter:blur(8px)}
    .eyebrow{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:900}.greeting{font-size:44px;line-height:1;margin:7px 0 7px;letter-spacing:-.045em;font-weight:950}.subtitle{font-size:19px;color:var(--muted);font-weight:650}
    .clock-card{border-radius:26px;padding:18px;display:flex;flex-direction:column;justify-content:center;text-align:center}.clock{font-size:44px;font-weight:950;letter-spacing:-.05em}.date{font-size:17px;color:var(--muted);font-weight:800;margin-top:4px}.updated{font-size:11px;color:#7f8ca3;margin-top:9px}
    .kids{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}.kid{border-radius:26px;padding:18px;position:relative;overflow:hidden}.kid.abi{box-shadow:inset 0 4px 0 var(--abi),0 16px 44px rgba(0,0,0,.24)}.kid.raphi{box-shadow:inset 0 4px 0 var(--raphi),0 16px 44px rgba(0,0,0,.24)}
    .kid-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.kid-name{font-size:32px;font-weight:950}.badge{padding:6px 10px;border-radius:999px;font-size:12px;font-weight:900;background:rgba(255,255,255,.07);color:var(--muted)}
    .split{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mini{background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.06);border-radius:18px;padding:12px}.mini-title{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:#8fa2bd;font-weight:950;margin-bottom:6px}.mini.next .mini-title{color:var(--cyan)}
    .task{display:flex;gap:9px;align-items:flex-start;padding:7px 0;border-top:1px solid rgba(255,255,255,.06);font-size:17px;line-height:1.25;font-weight:760}.task:first-child{border-top:0}.dot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:0 0 auto}.abi .dot{background:var(--abi)}.raphi .dot{background:var(--raphi)}
    .row{display:grid;grid-template-columns:1.2fr .8fr;gap:14px;margin-bottom:14px}.wide-card{border-radius:26px;padding:18px}.section-title{font-size:13px;text-transform:uppercase;letter-spacing:.14em;color:#91a0b6;font-weight:950;margin-bottom:10px}
    .event{display:grid;grid-template-columns:38px 1fr;gap:10px;align-items:center;padding:9px 0;border-top:1px solid rgba(255,255,255,.06)}.event:first-of-type{border-top:0}.event-icon{font-size:24px}.event-text{font-size:17px;font-weight:780;line-height:1.25}
    .parent-action{background:linear-gradient(145deg,rgba(255,216,107,.18),rgba(255,216,107,.07));border:1px solid rgba(255,216,107,.28)}.parent-action .big{font-size:23px;font-weight:920;line-height:1.3;color:#fff7c8}
    .status-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.status-pill{background:rgba(255,255,255,.045);border-radius:16px;padding:12px}.status-pill .label{font-size:11px;color:#8796ad;text-transform:uppercase;letter-spacing:.08em;font-weight:950}.status-pill .value{font-size:14px;font-weight:800;margin-top:5px;line-height:1.25}.ok{color:var(--green)}
    .footer{text-align:center;color:#5f718b;font-size:11px;padding:2px 0 0}
    @media(max-width:780px){.shell{padding:10px}.hero{grid-template-columns:1fr}.clock-card{display:none}.kids,.row,.split{grid-template-columns:1fr}.hero-main,.kid,.wide-card{border-radius:20px;padding:15px}.greeting{font-size:34px}.subtitle{font-size:16px}.kid-name{font-size:28px}.task{font-size:17px}}
    @media(min-width:781px) and (max-height:650px){.shell{padding:10px}.hero,.kids,.row{gap:9px;margin-bottom:9px}.hero-main,.clock-card,.kid,.wide-card{padding:13px;border-radius:18px}.greeting{font-size:31px}.clock{font-size:34px}.kid-name{font-size:25px}.task{font-size:14px;padding:5px 0}.mini{padding:9px}.event{padding:6px 0}.event-text{font-size:14px}}
  </style>
</head>
<body>
<div class="shell">
  <header class="hero">
    <div class="hero-main glass"><div class="eyebrow">School Command Center</div><div id="greeting" class="greeting">👋 Family Wall</div><div class="subtitle">See it. Do it. Then enjoy your time.</div></div>
    <div class="clock-card glass"><div id="clock" class="clock"></div><div id="date" class="date"></div><div id="updated" class="updated"></div></div>
  </header>

  <section class="kids">
    <article class="kid abi glass"><div class="kid-head"><div class="kid-name">👧 Abi</div><div class="badge">2nd Grade</div></div><div class="split"><div class="mini"><div class="mini-title">🌙 Tonight</div><div id="abi-now"></div></div><div class="mini next"><div class="mini-title">🎒 Next school day</div><div id="abi-next"></div></div></div></article>
    <article class="kid raphi glass"><div class="kid-head"><div class="kid-name">👦 Raphi</div><div class="badge">4th Grade</div></div><div class="split"><div class="mini"><div class="mini-title">🌙 Tonight</div><div id="raphi-now"></div></div><div class="mini next"><div class="mini-title">🎒 Next school day</div><div id="raphi-next"></div></div></div></article>
  </section>

  <section class="row">
    <article class="wide-card glass"><div class="section-title">📅 Coming up</div><div id="family"></div></article>
    <article class="wide-card parent-action"><div class="section-title">👨 Parent action</div><div id="parent" class="big"></div></article>
  </section>

  <section class="wide-card glass"><div class="section-title">✅ School status</div><div id="status" class="status-grid"></div></section>
  <div class="footer">Family-safe summary • refreshes automatically every 3 minutes</div>
</div>
<script>
const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));
function clean(x){return String(x||'').replace(/^[^\w\d]+\s*/,'')}
function taskList(id,items){const el=document.getElementById(id);const arr=(items&&items.length?items:['Nothing new']);el.innerHTML=arr.map(x=>'<div class="task"><span class="dot"></span><span>'+esc(clean(x))+'</span></div>').join('')}
function eventList(items){const el=document.getElementById('family');const arr=(items&&items.length?items:['✅ Nothing new']);el.innerHTML=arr.map(x=>{const m=String(x).match(/^(\S+)\s+(.*)$/);return '<div class="event"><div class="event-icon">'+esc(m?m[1]:'📌')+'</div><div class="event-text">'+esc(m?m[2]:x)+'</div></div>'}).join('')}
function statusList(items){const labels=['Transportation','Lunch / MySchoolBucks','Forms / Supplies'];const arr=(items&&items.length?items:['No new problem','No new issue','No action']);document.getElementById('status').innerHTML=arr.slice(0,3).map((x,i)=>'<div class="status-pill"><div class="label">'+esc(labels[i]||'Status')+'</div><div class="value"><span class="ok">●</span> '+esc(String(x).replace(/^\S+\s*/,'').replace(/^[^:]+:\s*/,''))+'</div></div>').join('')}
function tick(){const n=new Date();document.getElementById('clock').textContent=n.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});if(!document.getElementById('date').textContent)document.getElementById('date').textContent=n.toLocaleDateString([],{weekday:'long',month:'long',day:'numeric'});const h=n.getHours();document.getElementById('greeting').textContent=(h<12?'☀️ Good morning':h<17?'🌤️ Good afternoon':'🌙 Good evening')+', family';}setInterval(tick,1000);tick();
async function load(){try{const r=await fetch('data.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error();const d=await r.json();document.getElementById('date').textContent=d.date||'';document.getElementById('updated').textContent='Updated '+(d.updated||'just now');const abi=d.abi||{};const raphi=d.raphi||{};taskList('abi-now',abi.now||abi);taskList('abi-next',abi.next||[]);taskList('raphi-now',raphi.now||raphi);taskList('raphi-next',raphi.next||[]);eventList(d.family);document.getElementById('parent').textContent=d.parentAction||'Nothing urgent tonight.';statusList(d.status);}catch(e){document.getElementById('updated').textContent='Waiting for update…'}}
load();setInterval(load,180000);
</script>
</body>
</html>
