<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>Family Wall</title>
  <style>
    :root{font-family:Arial,Helvetica,sans-serif;color:#111;background:#f5f7fb}
    *{box-sizing:border-box} body{margin:0;padding:18px;min-height:100vh}
    .wrap{max-width:1100px;margin:0 auto}
    .top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:16px}
    h1{font-size:42px;margin:0}.date{font-size:24px;font-weight:700}.updated{font-size:14px;color:#666;text-align:right}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{background:#fff;border-radius:18px;padding:20px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
    .card h2{font-size:32px;margin:0 0 12px}.item{font-size:23px;line-height:1.35;margin:10px 0}.muted{color:#666}
    .wide{grid-column:1 / -1}.status{font-size:25px;font-weight:700}.footer{margin-top:14px;text-align:center;font-size:15px;color:#777}
    @media(max-width:700px){body{padding:10px}.grid{grid-template-columns:1fr}.wide{grid-column:auto}h1{font-size:32px}.date{font-size:20px}.card h2{font-size:27px}.item{font-size:20px}}
  </style>
</head>
<body>
<div class="wrap">
  <div class="top"><div><h1>🏠 Family Wall</h1><div id="date" class="date"></div></div><div id="updated" class="updated"></div></div>
  <div class="grid">
    <section class="card"><h2>👧 Abi</h2><div id="abi"></div></section>
    <section class="card"><h2>👦 Raphi</h2><div id="raphi"></div></section>
    <section class="card wide"><h2>📅 Family / Upcoming</h2><div id="family"></div></section>
    <section class="card wide"><h2>👨 Parent Action</h2><div id="parent" class="status"></div></section>
    <section class="card wide"><h2>🚌 School Status</h2><div id="status"></div></section>
  </div>
  <div class="footer">This screen refreshes automatically. Only family-safe summaries are shown here.</div>
</div>
<script>
function esc(s){return String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]))}
function renderList(id,items){const el=document.getElementById(id); el.innerHTML=(items&&items.length?items:['Nothing new']).map(x=>'<div class="item">'+esc(x)+'</div>').join('')}
async function load(){
  try{
    const r=await fetch('data.json?t='+Date.now(),{cache:'no-store'}); if(!r.ok) throw new Error('load failed');
    const d=await r.json();
    document.getElementById('date').textContent=d.date||'';
    document.getElementById('updated').textContent='Updated: '+(d.updated||'');
    renderList('abi',d.abi); renderList('raphi',d.raphi); renderList('family',d.family); renderList('status',d.status);
    document.getElementById('parent').textContent=d.parentAction||'Nothing new requires action.';
  }catch(e){document.getElementById('updated').textContent='Waiting for dashboard update…'}
}
load(); setInterval(load,180000);
</script>
</body>
</html>
